apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: "2023241041"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
      - name: arelyxl-portfolio
        image: arelyxl/portfolio:v2.1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
  namespace: "2023241041"
spec:
  type: NodePort
  selector:
    app: portfolio
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30009
